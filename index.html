<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        h1 { margin: 10px 0 5px; font-size: 22px; color: #111; }
        p { color: #666; font-size: 14px; margin: 0 0 20px; }
        .btn {
            display: block;
            background: #0056b3;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover { background: #004085; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Change details below for your boss -->
        <h1>Datuk / Ms. Janice</h1>
        <p>Chief Operating Officer | Newman Trust Investment Bank</p>

        <a href="tel:+60326392589" class="btn">📞 Call Office</a>
        <a href="mailto:yang@nwtrustbank.com" class="btn">✉️ Send Email</a>
        <a href="https://nwtrustbank.com/" class="btn" target="_blank">🌐 Visit Website</a>
    </div>

</body>
</html>
