<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for High-End Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top right, #1a2744, #070d1a);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --gold-gradient: linear-gradient(135deg, #f3e7c4 0%, #c5a059 50%, #997530 100%);
            --gold-solid: #c5a059;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(197, 160, 89, 0.07);
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: rgba(11, 19, 43, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            overflow-y: auto;
        }

        @media (min-width: 480px) {
            .wrapper {
                min-height: auto;
                border-radius: 28px;
                margin: 20px 0;
                border: 1px solid var(--card-border);
            }
        }

        /* Header & Cover Banner */
        .header-banner {
            height: 130px;
            background: linear-gradient(to right, #0f172a, #1e293b);
            position: relative;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .company-badge {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--gold-solid);
            text-transform: uppercase;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.2);
        }

        /* Profile Details */
        .profile-container {
            padding: 0 24px;
            text-align: center;
            margin-top: -55px;
            position: relative;
        }

        .avatar-frame {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 3px;
            background: var(--gold-gradient);
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #0b132b;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-top: 14px;
            letter-spacing: 0.3px;
        }

        .designation {
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-solid);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        .company-name {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
            margin-bottom: 24px;
        }

        /* Hero Action Buttons */
        .hero-actions {
            display: flex;
            gap: 12px;
            padding: 0 24px;
            margin-bottom: 28px;
        }

        .btn-main {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-gold {
            background: var(--gold-gradient);
            color: #0b132b;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(197, 160, 89, 0.4);
        }

        .btn-glass {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Contact Details Section */
        .section-heading {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0 24px;
            margin-bottom: 12px;
            text-align: left;
        }

        .contact-stack {
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 28px;
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .contact-card:hover {
            border-color: rgba(197, 160, 89, 0.4);
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(3px);
        }

        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(197, 160, 89, 0.1);
            color: var(--gold-solid);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .contact-info {
            text-align: left;
            flex: 1;
        }

        .contact-info .label {
            font-size: 11px;
            color: var(--text-secondary);
            display: block;
        }

        .contact-info .value {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Bottom Grid Dock */
        .dock-grid {
            margin-top: auto;
            background: rgba(5, 10, 22, 0.8);
            border-top: 1px solid var(--card-border);
            padding: 20px 24px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .dock-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .dock-item:hover {
            background: rgba(197, 160, 89, 0.15);
            border-color: var(--gold-solid);
            color: var(--gold-solid);
        }

        .dock-item i {
            font-size: 16px;
        }

        .dock-item span {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .dock-item:hover span {
            color: var(--gold-solid);
        }
    </style>
</head>
<body>

<div class="ambient-glow" style="top: 10%; left: 10%;"></div>
<div class="ambient-glow" style="bottom: 10%; right: 10%;"></div>

<div class="wrapper">
    <!-- Cover Banner -->
    <div class="header-banner">
        <div class="company-badge">NEWMAN TRUST INVESTMENT BANKING</div>
    </div>

    <!-- Profile Head -->
    <div class="profile-container">
        <div class="avatar-frame">
            <!-- Ms. Janice picture -->
            <img src="profile-picture/dp2.jpg" alt="COO profile picture">
        </div>
        <h1>Datuk/Ms. Janice</h1>
        <div class="designation">Chief Operating Officer</div>
        <div class="company-name">Newman Trust Investment Banking</div>
    </div>

    <!-- Main Action Buttons -->
    <div class="hero-actions">
        <a href="tel:+60132888669" class="btn-main btn-gold">
            <i class="fa-solid fa-phone-flip"></i> Direct Call
        </a>
        <a href="mailto:yang@nwtrustbank.com" class="btn-main btn-glass">
            <i class="fa-solid fa-envelope"></i> Email Me
        </a>
    </div>

    <!-- Contact Credentials Stack -->
    <div class="section-heading">Secure Contact Channels</div>
    <div class="contact-stack">
        <a href="tel:+60326392589" class="contact-card">
            <div class="icon-box"><i class="fa-solid fa-phone"></i></div>
            <div class="contact-info">
                <span class="label">Office Line</span>
                <span class="value">+603 2639 2589</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: var(--text-secondary);"></i>
        </a>

        <a href="mailto:yang@nwtrustbank.com" class="contact-card">
            <div class="icon-box"><i class="fa-solid fa-envelope-open-text"></i></div>
            <div class="contact-info">
                <span class="label">Corporate Email</span>
                <span class="value">yang@nwtrustbank.com</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: var(--text-secondary);"></i>
        </a>

        <a href="https://linkedin.com/in/janice-yang-341189266/" target="_blank" class="contact-card">
            <div class="icon-box"><i class="fa-brands fa-linkedin-in"></i></div>
            <div class="contact-info">
                <span class="label">Professional Network</span>
                <span class="value">linkedin.com/in/janice-yang</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: var(--text-secondary);"></i>
        </a>
    </div>

    <!-- Bottom Action Dock -->
    <div class="dock-grid">
        <a href="tel:+60312345678" class="dock-item">
            <i class="fa-solid fa-phone"></i>
            <span>Call</span>
        </a>
        <a href="https://wa.me/60312345678" target="_blank" class="dock-item">
            <i class="fa-brands fa-whatsapp"></i>
            <span>WhatsApp</span>
        </a>
        <a href="mailto:yang@nwtrustbank.com" class="dock-item">
            <i class="fa-solid fa-envelope"></i>
            <span>Email</span>
        </a>
        <a href="#" onclick="alert('vCard download triggered')" class="dock-item">
            <i class="fa-solid fa-address-card"></i>
            <span>vCard</span>
        </a>
    </div>
</div>

</body>
</html>
